<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pristine Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: white;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 18px;
      color: #000;
    }

    @media print {
      body { min-height: unset; }
      @page { margin: 0; size: 200px 60px; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
         fill="black" stroke="none">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
      <line x1="20" y1="3" x2="20" y2="7" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="5" x2="18" y2="5" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="17" x2="4" y2="19" stroke="black" stroke-width="2" stroke-linecap="round"/>
      <line x1="5" y1="18" x2="3" y2="18" stroke="black" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Pristine</span>
  </div>
</body>
</html>
